name: Catalog Desk CI

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_v14.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements_v14.txt
      - name: Run all Python tests
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Check browser userscript syntax
        run: |
          node --check 5ka_batch_enrichment_v14.user.js
          node --check pr_batch_enrichment_v15.user.js
