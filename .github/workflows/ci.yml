name: Catalog Desk CI

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_v14.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements_v14.txt
      - name: Run all Python tests
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Check browser JavaScript syntax
        run: |
          node --check ui_v14/app.js
          node --check ui_v14/5ka_batch_enrichment_v16.user.js
          node --check ui_v14/pr_batch_enrichment_v16.user.js
          node --check 5ka_batch_enrichment_v16.user.js
          node --check pr_batch_enrichment_v16.user.js
      - name: Run Perekrestok DOM parser regression tests
        run: node test_perekrestok_dom_parser_v16.js

      - name: Run Pyaterochka taxonomy and parser regression tests
        run: node test_5ka_product_data_policy_v17.js

      - name: Install DOM harness dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run browser-like DOM regression harness
        run: npm run test:dom
      - name: Install Chromium for real-browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run Chromium smoke tests on captured pages
        run: npm run test:chromium
